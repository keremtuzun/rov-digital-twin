name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts ros2/rov_dt_bridge/rov_dt_bridge
      - run: python -m compileall -q src scripts ros2/rov_dt_bridge/rov_dt_bridge
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_unity_project.py
      - run: rovdt demo --output-dir artifacts/ci-demo
