behaviors:
  OceanSenseROV:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 7.5e-5
      beta: 8.0e-4
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 192
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 150000
    time_horizon: 96
    summary_freq: 2500
    keep_checkpoints: 6
    checkpoint_interval: 20000
    threaded: true

environment_parameters:
  difficulty:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.05
      max_value: 0.35

engine_settings:
  width: 320
  height: 180
  quality_level: 0
  time_scale: 25
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
