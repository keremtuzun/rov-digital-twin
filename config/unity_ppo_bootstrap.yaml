behaviors:
  OceanSenseROV:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 4096
      learning_rate: 1.0e-4
      beta: 4.0e-3
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 100000
    time_horizon: 64
    summary_freq: 2500
    keep_checkpoints: 4
    checkpoint_interval: 5000
    threaded: true

environment_parameters:
  difficulty:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.1
      max_value: 0.3

engine_settings:
  width: 640
  height: 360
  quality_level: 0
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
