behaviors:
  OceanSenseROV:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 1.0e-4
      beta: 8.0e-4
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 192
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 500000
    time_horizon: 96
    summary_freq: 5000
    keep_checkpoints: 10
environment_parameters:
  difficulty:
    curriculum:
      - name: level_0_calm
        completion_criteria: {measure: reward, behavior: OceanSenseROV, signal_smoothing: true, min_lesson_length: 20000, threshold: 8.0}
        value: 0.05
      - name: level_1_mild
        completion_criteria: {measure: reward, behavior: OceanSenseROV, signal_smoothing: true, min_lesson_length: 30000, threshold: 8.5}
        value: 0.20
      - name: level_2_waves_bias
        completion_criteria: {measure: reward, behavior: OceanSenseROV, signal_smoothing: true, min_lesson_length: 40000, threshold: 9.0}
        value: 0.45
      - name: level_3_turbulence_dropout
        completion_criteria: {measure: reward, behavior: OceanSenseROV, signal_smoothing: true, min_lesson_length: 50000, threshold: 9.0}
        value: 0.70
      - name: level_4_combined
        value: 1.0
engine_settings:
  time_scale: 25
  no_graphics: true
